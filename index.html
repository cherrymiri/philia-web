<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>PHILIA — 우정의 사랑</title>
</head>
<body>
<div id="app">
  <canvas id="c" aria-label="투명 말랑이와 재료"></canvas>
  <div id="labels"></div>
  <header id="title">
    <div class="title-row"><span class="rule"></span><h1>PHILIA</h1><span class="rule"></span></div>
    <p class="subtitle">우정의 사랑</p>
    <p class="intro">함께 쌓아 온 시간의 조각을 직접 고르고, 섞고, 만지며 나만의 우정을 완성합니다.</p>
  </header>
  <div id="corner"><button id="reset" type="button">처음부터 다시</button></div>
  <div id="guide" hidden><b>이제 직접 섞어보세요.</b><span>재료는 언제든 더 추가할 수 있어요.</span></div>
  <button id="mixbtn" type="button">말랑이 섞기</button>
  <div id="mixbar" hidden>
    <button id="addbtn" type="button">재료 더 넣기</button>
    <button id="donebtn" type="button">완성하기</button>
    <button id="handbtn" type="button">손 인식 켜기</button>
  </div>
  <div id="cam" hidden>
    <div id="campreview"><video id="camvideo" muted playsinline></video><canvas id="camdots" width="640" height="480"></canvas><span id="camcount"></span></div>
    <div id="camctl"><button id="camtoggle" type="button">카메라 숨기기</button><button id="handoff" type="button">손 인식 끄기</button></div>
    <dl id="handhelp">
      <div><dt>한 손가락</dt><dd>콕 눌러 끌기</dd></div>
      <div><dt>주먹</dt><dd>지그시 누르기</dd></div>
      <div><dt>손바닥</dt><dd>부드럽게 쓸기</dd></div>
      <div><dt>엄지+검지</dt><dd>집어서 끌기</dd></div>
      <div><dt>가장자리</dt><dd>밖으로 늘리고, 안으로 접기</dd></div>
      <div><dt>양손</dt><dd>동시에 잡아 늘리기</dd></div>
    </dl>
  </div>
  <p id="handmsg" hidden role="status"></p>
  <canvas id="handlayer"></canvas>
  <div id="ending" hidden>
    <p id="endtitle">PHILIA</p>
    <div id="endtext">
      <p id="endhead">당신의 우정 말랑이</p>
      <h1 id="endname"></h1>
      <p id="endused"></p>
      <div id="endbtns">
        <button id="savecard" type="button">내 말랑이 저장하기</button>
        <button id="saveobject" type="button">말랑이만 저장</button>
        <button id="again" type="button">다시 만들기</button>
      </div>
      <p id="savemsg" role="status"></p>
    </div>
  </div>
  <div id="loaderror" hidden>모델을 불러오지 못했습니다. 새로고침해 주세요.</div>
  <div id="dropbar" hidden>
    <span id="dropmsg">말랑이를 눌러 한 방울씩 떨어뜨리세요</span>
    <button id="dropdone" type="button">넣기 완료</button>
  </div>
</div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
